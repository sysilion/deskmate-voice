# 태그를 밀면 플랫폼별 음성 번들을 굽고 릴리스에 올린다.
#
# 굽는 일은 파일을 받아 추려 다시 묶는 것뿐이라 어느 러너에서 해도 결과가 같다.
# 그래서 매트릭스를 돌리지 않고 한 러너에서 전부 만든다.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 원본은 수백 MB다. 태그마다 다시 받지 않게 남겨 둔다.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: sources-${{ hashFiles('tools/build-bundle.py') }}

      - name: 번들 굽기
        run: |
          for platform in osx-arm64 osx-x64 linux-x64 win-x64; do
            python tools/build-bundle.py --platform "$platform" --voice ko --out dist
          done

      - name: 목록 만들기
        run: python tools/write-manifest.py --dir dist --tag "${{ github.ref_name }}"

      - name: 확인
        run: |
          ls -lh dist
          cat dist/manifest.json

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: dist/*
          body: |
            deskmate 가 받아 쓰는 음성 번들입니다. 사람이 직접 받을 것은 없습니다.

            [sherpa-onnx](https://github.com/k2-fsa/sherpa-onnx) (Apache-2.0) 실행 파일과
            음성 모델에서 **말하는 데 필요한 것만** 남겼습니다.
